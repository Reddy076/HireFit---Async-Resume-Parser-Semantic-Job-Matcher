name: hirefit

services:
  consul:
    image: hashicorp/consul:1.19
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul-data:/consul/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hirefit
      POSTGRES_PASSWORD: hirefit
      POSTGRES_DB: hirefit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirefit"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kakfa/data

  auth-service:
    build: ./services/auth
    environment:
      PORT: 8001
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+psycopg2://hirefit:hirefit@postgres:5432/hirefit
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8001:8001"
    depends_on:
      consul:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      retries: 5

  resume-service:
    build: ./services/resume
    environment:
      PORT: 8002
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: resume-service
      DATABASE_URL: postgresql+psycopg2://hirefit:hirefit@postgres:5432/hirefit
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: resumes
      KAFKA_BOOTSTRAP: kafka:9092
      MAX_UPLOAD_BYTES: 10485760
    ports:
      - "8002:8002"
    depends_on:
      consul:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      retries: 5

  parsing-service:
    build: ./services/parsing
    environment:
      PORT: 8003
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: parsing-service
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_IN: resume.uploaded
      KAFKA_TOPIC_OUT: resume.parsed
      RESUME_API: http://resume-service:8002
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: resumes
      WORKER_ENABLED: 1
    ports:
      - "8003:8003"
    depends_on:
      consul:
        condition: service_started
      kafka:
        condition: service_started
      resume-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      retries: 5

  job-service:
    build: ./services/job
    environment:
      PORT: 8004
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: job-service
      DATABASE_URL: postgresql+psycopg2://hirefit:hirefit@postgres:5432/hirefit
      JWT_SECRET: dev-secret-change-me
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8004:8004"
    depends_on:
      consul:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      retries: 5

  embedding-service:
    build: ./services/embedding
    environment:
      PORT: 8005
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: embedding-service
      DATABASE_URL: postgresql+psycopg2://hirefit:hirefit@postgres:5432/hirefit
      RESUME_API: http://resume-service:8002
      JOB_API: http://job-service:8004
      KAFKA_BOOTSTRAP: kafka:9092
      EMBED_BACKEND: hash
      WORKER_ENABLED: 1
    ports:
      - "8005:8005"
    depends_on:
      consul:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      resume-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      retries: 5

  matching-service:
    build: ./services/matching
    environment:
      PORT: 8006
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: matching-service
      DATABASE_URL: postgresql+psycopg2://hirefit:hirefit@postgres:5432/hirefit
      JWT_SECRET: dev-secret-change-me
      RESUME_API: http://resume-service:8002
      JOB_API: http://job-service:8004
      EMBED_API: http://embedding-service:8005
      RERANK_BACKEND: heuristic
    ports:
      - "8006:8006"
    depends_on:
      consul:
        condition: service_started
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 10s
      retries: 5

  llm-service:
    build: ./services/llm
    environment:
      PORT: 8007
      CONSUL_HTTP_ADDR: http://consul:8500
      SERVICE_NAME: llm-service
      DATABASE_URL: postgresql+psycopg2://hirefit:hirefit@postgres:5432/hirefit
      JWT_SECRET: dev-secret-change-me
      RESUME_API: http://resume-service:8002
      JOB_API: http://job-service:8004
      MATCH_API: http://matching-service:8006
      LLM_BACKEND: heuristic
    ports:
      - "8007:8007"
    depends_on:
      consul:
        condition: service_started
      postgres:
        condition: service_healthy
      matching-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 10s
      retries: 5

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    depends_on:
      - auth-service
      - resume-service
      - job-service
      - embedding-service
      - matching-service
      - llm-service

volumes:
  postgres-data:
  consul-data:
  minio-data:
  kafka-data:
